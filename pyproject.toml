[project]
name = "open-finance-pipeline"
version = "0.1.0"
description = "Medallion (Bronze/Silver/Gold) pipeline: Yahoo Finance + FRED + Bolivia FX, dbt, FastAPI, React dashboard."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
