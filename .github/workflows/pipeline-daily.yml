name: Pipeline diario (precios)

on:
  schedule:
    # Todos los días 22:00 UTC (mercados de EE.UU. cerrados).
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # permite ejecutarlo a mano

jobs:
  el-prices:
    name: EL Python — precios (yfinance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: EL — extraer y cargar precios crudos a openfin_raw
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.el.pipeline prices
